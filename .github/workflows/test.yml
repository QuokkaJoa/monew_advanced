#
#      - name: Grant execute permission to gradlew
#        run: chmod +x ./gradlew

      # [3] 테스트 실행 (환경변수 주입)
      - name: Build and Test with Gradle
        run: ./gradlew test
        env:
          # 여기서 'test' 프로파일을 강제로 주입하여 local 설정 로딩을 막습니다.
          SPRING_PROFILES_ACTIVE: test
