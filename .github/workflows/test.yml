#              hibernate:
#                ddl-auto: create-drop
#              show-sql: true
#              properties:
#                hibernate:
#                  dialect: org.hibernate.dialect.H2Dialect
#                  format_sql: true
#              defer-datasource-initialization: false
#            data:
#              redis:
#                host: localhost
#                port: 6379
#          monew:
#            storage:
#              s3:
#                accessKeyId: test-key
