name: Monew CI (Test Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # [1] Redis 서비스 컨테이너 (기존 유지)
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # [2] application-test.yml 파일 생성 (선택 사항이지만 안전장치로 추천)
      # 깃허브에 파일을 올렸다면 이 단계는 생략해도 되지만,
      # 만약 .gitignore 때문에 안 올라갔을 경우를 대비해 여기서 직접 만들어줍니다.
